<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#2399</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            overflow-x: hidden;
            cursor: none;
            min-height: 100vh;
        }

        /* Custom Cursor */
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid #ff0000;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            transition: transform 0.1s;
            mix-blend-mode: difference;
        }

        .cursor-dot {
            width: 5px;
            height: 5px;
            background: #ff0000;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 99999;
        }

        /* Blood Drip */
        .blood-drip {
            position: fixed;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .drip {
            position: absolute;
            top: -10px;
            width: 3px;
            background: linear-gradient(to bottom, #ff0000, #8b0000);
            border-radius: 0 0 50% 50%;
            animation: dripping var(--duration) var(--delay) infinite;
            opacity: 0;
        }

        @keyframes dripping {
            0% { height: 0; opacity: 0; top: -10px; }
            10% { opacity: 0.8; }
            50% { height: 80px; }
            100% { height: 120px; opacity: 0; top: 100vh; }
        }

        /* Fog Effect */
        .fog {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.15;
        }

        .fog-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(139,0,0,0.3) 0%, transparent 70%);
            animation: fogMove 20s infinite linear;
        }

        .fog-layer:nth-child(2) {
            animation: fogMove2 25s infinite linear;
            opacity: 0.5;
        }

        @keyframes fogMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes fogMove2 {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        /* Glitch Effect */
        .glitch {
            position: relative;
            font-size: 8rem;
            font-weight: bold;
            text-align: center;
            margin-top: 10vh;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 80px #8b0000;
            animation: glitchText 3s infinite;
            letter-spacing: 10px;
        }

        .glitch::before,
        .glitch::after {
            content: '#2399';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            color: #0ff;
            animation: glitchBefore 0.3s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
            transform: translate(-3px);
        }

        .glitch::after {
            color: #f0f;
            animation: glitchAfter 0.3s infinite;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
            transform: translate(3px);
        }

        @keyframes glitchBefore {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 3px); }
            40% { transform: translate(5px, -3px); }
            60% { transform: translate(-3px, 1px); }
            80% { transform: translate(3px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes glitchAfter {
            0% { transform: translate(0); }
            20% { transform: translate(5px, -3px); }
            40% { transform: translate(-5px, 3px); }
            60% { transform: translate(3px, -1px); }
            80% { transform: translate(-3px, 2px); }
            100% { transform: translate(0); }
        }

        @keyframes glitchText {
            0%, 90%, 100% { opacity: 1; }
            91% { opacity: 0.8; transform: translate(2px, -1px) skewX(2deg); }
            92% { opacity: 1; transform: translate(-2px, 1px) skewX(-2deg); }
            93% { opacity: 0.6; }
            94% { opacity: 1; }
            95% { opacity: 0.9; transform: translate(1px, 2px); }
        }

        /* Screen Flash */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            animation: screenFlash 8s infinite;
        }

        @keyframes screenFlash {
            0%, 94%, 96%, 98%, 100% { opacity: 0; }
            95% { opacity: 0.15; }
            97% { opacity: 0.08; }
            99% { opacity: 0.12; }
        }

        /* Scan Lines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 98;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.8) 100%);
        }

        /* Subtitle */
        .subtitle {
            text-align: center;
            font-size: 1.2rem;
            color: #8b0000;
            margin-top: 20px;
            letter-spacing: 5px;
            animation: fadeInUp 2s ease-out, pulse 4s 2s infinite;
            text-shadow: 0 0 10px #8b0000;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; }
        }

        /* Warning Text */
        .warning {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #ff4444;
            animation: warningFlicker 2s infinite;
            letter-spacing: 3px;
        }

        @keyframes warningFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
            51% { opacity: 1; }
            52% { opacity: 0.3; }
            53% { opacity: 1; }
        }

        /* Eye Container */
        .eye-container {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 60px;
            perspective: 500px;
        }

        .eye {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ff0000 30%, #8b0000 60%, #330000 100%);
            border-radius: 50%;
            position: relative;
            animation: eyeFloat 3s ease-in-out infinite;
            box-shadow: 0 0 20px #ff0000, 0 0 40px #8b0000, inset 0 0 15px rgba(0,0,0,0.5);
        }

        .eye::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #000;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pupilMove 4s ease-in-out infinite;
            box-shadow: 0 0 5px #ff0000;
        }

        .eye:nth-child(2) {
            animation-delay: 0.5s;
        }

        @keyframes eyeFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pupilMove {
            0%, 100% { transform: translate(-50%, -50%); }
            25% { transform: translate(-30%, -60%); }
            50% { transform: translate(-70%, -40%); }
            75% { transform: translate(-40%, -50%); }
        }

        /* Creepy Message */
        .creepy-msg {
            text-align: center;
            margin-top: 50px;
            font-size: 1.5rem;
            color: #ff0000;
            opacity: 0;
            animation: scaryAppear 5s 3s forwards;
            text-shadow: 0 0 10px #ff0000;
            position: relative;
        }

        @keyframes scaryAppear {
            0% { opacity: 0; transform: scale(0.5); filter: blur(10px); }
            50% { opacity: 0.5; filter: blur(5px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        /* Discord Button */
        .discord-section {
            margin-top: 60px;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 2s 5s forwards;
        }

        .discord-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #5865F2, #7289da);
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-family: 'Creepster', cursive;
            letter-spacing: 3px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.3);
            animation: btnPulse 2s infinite;
        }

        .discord-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(88, 101, 242, 0.6), 0 0 80px rgba(88, 101, 242, 0.3);
        }

        .discord-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: btnShine 3s infinite;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(88, 101, 242, 0.3); }
            50% { box-shadow: 0 0 30px rgba(255, 0, 0, 0.5), 0 0 60px rgba(88, 101, 242, 0.3); }
        }

        /* Made by */
        .made-by {
            text-align: center;
            margin-top: 40px;
            font-size: 1rem;
            color: #666;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeInUp 2s 6s forwards;
        }

        .made-by span {
            color: #ff0000;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0000;
            animation: nameGlow 2s infinite;
        }

        @keyframes nameGlow {
            0%, 100% { text-shadow: 0 0 10px #ff0000; }
            50% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #8b0000; }
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #ff0000;
            border-radius: 50%;
            animation: particleFloat var(--duration) var(--delay) infinite;
            opacity: 0;
            box-shadow: 0 0 6px #ff0000;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Hidden Face Flash */
        .hidden-face {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15rem;
            color: rgba(255, 0, 0, 0.03);
            z-index: 5;
            animation: faceFlash 10s infinite;
            pointer-events: none;
            user-select: none;
        }

        @keyframes faceFlash {
            0%, 85%, 87%, 100% { opacity: 0; }
            86% { opacity: 1; }
        }

        /* Static Noise */
        .noise {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            pointer-events: none;
            z-index: 97;
            opacity: 0.04;
            animation: noiseMove 0.5s steps(10) infinite;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        @keyframes noiseMove {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-10%, -10%); }
            20% { transform: translate(10%, 5%); }
            30% { transform: translate(-5%, 10%); }
            40% { transform: translate(15%, -5%); }
            50% { transform: translate(-10%, 15%); }
            60% { transform: translate(10%, -10%); }
            70% { transform: translate(-15%, 5%); }
            80% { transform: translate(5%, 10%); }
            90% { transform: translate(-10%, -15%); }
            100% { transform: translate(10%, 0); }
        }

        /* Creepy Symbols */
        .symbols {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 8;
            overflow: hidden;
        }

        .symbol {
            position: absolute;
            font-size: 2rem;
            color: rgba(139, 0, 0, 0.15);
            animation: symbolFloat var(--duration) var(--delay) infinite;
        }

        @keyframes symbolFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* Heartbeat Line */
        .heartbeat {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: 50px;
            z-index: 60;
            pointer-events: none;
        }

        .heartbeat svg {
            width: 100%;
            height: 100%;
        }

        .heartbeat-line {
            stroke: #ff0000;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: heartbeatDraw 3s linear infinite;
            filter: drop-shadow(0 0 5px #ff0000);
        }

        @keyframes heartbeatDraw {
            to { stroke-dashoffset: 0; }
        }

        /* Creepy Numbers */
        .creepy-numbers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 7;
            overflow: hidden;
        }

        .creepy-num {
            position: absolute;
            color: rgba(255, 0, 0, 0.06);
            font-size: 1.5rem;
            font-weight: bold;
            animation: numScroll var(--duration) var(--delay) infinite linear;
        }

        @keyframes numScroll {
            0% { transform: translateY(100vh); opacity: 0; }
            5% { opacity: 0.06; }
            95% { opacity: 0.06; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }

        /* Screen Shake on Click */
        @keyframes shake {
            0%, 100% { transform: translate(0); }
            10% { transform: translate(-5px, -5px); }
            20% { transform: translate(5px, 5px); }
            30% { transform: translate(-5px, 5px); }
            40% { transform: translate(5px, -5px); }
            50% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            70% { transform: translate(-3px, 3px); }
            80% { transform: translate(3px, -3px); }
            90% { transform: translate(-1px, -1px); }
        }

        .shaking {
            animation: shake 0.5s ease-in-out;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s, visibility 1s;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-text {
            font-family: 'Creepster', cursive;
            font-size: 2rem;
            color: #ff0000;
            animation: loadFlicker 0.5s infinite;
        }

        .loading-bar {
            width: 200px;
            height: 3px;
            background: #333;
            margin-top: 20px;
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-fill {
            height: 100%;
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
            animation: loadFill 3s forwards;
        }

        @keyframes loadFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes loadFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Pentagram */
        .pentagram {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            opacity: 0.03;
            z-index: 4;
            animation: pentagramRotate 60s linear infinite;
            pointer-events: none;
        }

        @keyframes pentagramRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Random Text Popups */
        .popup-text {
            position: fixed;
            color: #ff0000;
            font-size: 1.5rem;
            font-family: 'Creepster', cursive;
            pointer-events: none;
            z-index: 10001;
            opacity: 0;
            text-shadow: 0 0 10px #ff0000;
            animation: popIn 1.5s forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.2); }
            40% { transform: scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.5); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .glitch {
                font-size: 4rem;
            }
            .eye-container {
                gap: 30px;
            }
            .eye {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-text">...جارٍ التحميل</div>
        <div class="loading-bar">
            <div class="loading-fill"></div>
        </div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor" id="cursor"></div>
    <div class="cursor-dot" id="cursorDot"></div>

    <!-- Screen Effects -->
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="noise"></div>
    <div class="flash-overlay"></div>

    <!-- Blood Drips -->
    <div class="blood-drip" id="bloodDrip"></div>

    <!-- Fog -->
    <div class="fog">
        <div class="fog-layer"></div>
        <div class="fog-layer"></div>
    </div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Creepy Symbols -->
    <div class="symbols" id="symbols"></div>

    <!-- Creepy Numbers -->
    <div class="creepy-numbers" id="creepyNumbers"></div>

    <!-- Hidden Face -->
    <div class="hidden-face">👁</div>

    <!-- Pentagram SVG -->
    <svg class="pentagram" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="95" fill="none" stroke="#ff0000" stroke-width="1"/>
        <polygon points="100,5 127,80 195,80 140,125 160,195 100,155 40,195 60,125 5,80 73,80" fill="none" stroke="#ff0000" stroke-width="0.5"/>
    </svg>

    <!-- Main Content -->
    <div id="mainContent">
        <div class="glitch">#2399</div>

        <div class="subtitle">⚠ لا أحد يهرب من هنا ⚠</div>

        <div class="eye-container">
            <div class="eye" id="eye1"></div>
            <div class="eye" id="eye2"></div>
        </div>

        <div class="creepy-msg" id="creepyMsg">أنت لست وحدك...</div>

        <div class="warning">⚠ تحذير: لا تنظر خلفك ⚠</div>

        <div class="discord-section">
            <a href="https://discord.gg/2-9" target="_blank" class="discord-btn">
                🦇 انضم إلى الديسكورد 🦇
            </a>
        </div>

        <div class="made-by">
            صُنع بواسطة <span>سعود</span> 💀
        </div>
    </div>

    <!-- Heartbeat Line -->
    <div class="heartbeat">
        <svg viewBox="0 0 1200 50" preserveAspectRatio="none">
            <polyline class="heartbeat-line" points="0,25 100,25 120,25 140,5 160,45 180,25 200,25 300,25 320,25 340,5 360,45 380,25 400,25 500,25 520,25 540,5 560,45 580,25 600,25 700,25 720,25 740,5 760,45 780,25 800,25 900,25 920,25 940,5 960,45 980,25 1000,25 1100,25 1120,25 1140,5 1160,45 1180,25 1200,25"/>
        </svg>
    </div>

    <script>
        // Loading Screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 3500);
        });

        // Custom Cursor
        const cursor = document.getElementById('cursor');
        const cursorDot = document.getElementById('cursorDot');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX - 10 + 'px';
            cursor.style.top = e.clientY - 10 + 'px';
            cursorDot.style.left = e.clientX - 2.5 + 'px';
            cursorDot.style.top = e.clientY - 2.5 + 'px';
        });

        document.addEventListener('mousedown', () => {
            cursor.style.transform = 'scale(1.5)';
            document.body.classList.add('shaking');
            setTimeout(() => {
                document.body.classList.remove('shaking');
                cursor.style.transform = 'scale(1)';
            }, 500);
        });

        // Blood Drips
        const bloodDripContainer = document.getElementById('bloodDrip');
        for (let i = 0; i < 15; i++) {
            const drip = document.createElement('div');
            drip.className = 'drip';
            drip.style.left = Math.random() * 100 + '%';
            drip.style.setProperty('--duration', (3 + Math.random() * 5) + 's');
            drip.style.setProperty('--delay', (Math.random() * 8) + 's');
            bloodDripContainer.appendChild(drip);
        }

        // Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.setProperty('--duration', (5 + Math.random() * 10) + 's');
            particle.style.setProperty('--delay', (Math.random() * 10) + 's');
            particle.style.width = (1 + Math.random() * 3) + 'px';
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }

        // Creepy Symbols
        const symbolsContainer = document.getElementById('symbols');
        const creepySymbols = ['☠', '👁', '💀', '⛧', '🦇', '🕷', '👻', '⚰', '🕸', '†', '☽', '⛥'];
        for (let i = 0; i < 20; i++) {
            const symbol = document.createElement('div');
            symbol.className = 'symbol';
            symbol.textContent = creepySymbols[Math.floor(Math.random() * creepySymbols.length)];
            symbol.style.left = Math.random() * 100 + '%';

            const centerY1 = rect1.top + rect1.height / 2;
            const centerX2 = rect2.left + rect2.width / 2;
            const centerY2 = rect2.top + rect2.height / 2;

            const angle1 = Math.atan2(e.clientY - centerY1, e.clientX - centerX1);
            const angle2 = Math.atan2(e.clientY - centerY2, e.clientX - centerX2);

            const moveX1 = Math.cos(angle1) * 8;
            const moveY1 = Math.sin(angle1) * 8;
            const moveX2 = Math.cos(angle2) * 8;
            const moveY2 = Math.sin(angle2) * 8;

            eye1.style.setProperty('--px', moveX1 + 'px');
            eye1.style.setProperty('--py', moveY1 + 'px');
            eye1.querySelector('::after');

            eye2.style.setProperty('--px', moveX2 + 'px');
            eye2.style.setProperty('--py', moveY2 + 'px');
        });

        // Override eye pupil movement with JS tracking
        document.addEventListener('mousemove', (e) => {
            document.querySelectorAll('.eye').forEach(eye => {
                const rect = eye.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
                const distance = Math.min(12, Math.hypot(e.clientX - centerX, e.clientY - centerY) / 15);
                const pupil = eye.querySelector('::after');

                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;

                eye.style.cssText += `--pupil-x: ${x}px; --pupil-y: ${y}px;`;
            });
        });

        // Audio Context for creepy sound on click
        document.addEventListener('click', () => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.frequency.setValueAtTime(100, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                oscillator.type = 'sawtooth';

                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

                oscillator.start(audioCtx.currentTime);

            } catch (e) {}
